[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enslookup"
version = "0.1.0"
description = "ens names to addresses and back, plus text records. pure python, public rpc, no keys."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alina Schanz" }]
keywords = ["ethereum", "ens", "cli", "onchain"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/alinaschanz/ens-lookup"
Author = "https://alinaschanz.life"
Issues = "https://github.com/alinaschanz/ens-lookup/issues"
Changelog = "https://github.com/alinaschanz/ens-lookup/blob/main/CHANGELOG.md"

[project.scripts]
enslookup = "enslookup.cli:main"

[tool.setuptools]
packages = ["enslookup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
