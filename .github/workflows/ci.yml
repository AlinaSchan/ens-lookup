name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest .
      - run: python -m pytest -q
      - run: enslookup --version

  live:
    # public rpcs come and go; this job is informative, not required
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest .
      - run: python -m pytest -q tests/test_live.py
        env:
          ENSLOOKUP_LIVE: "1"
      - run: enslookup vitalik.eth 0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045 --all-text

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff
      - run: ruff check .
